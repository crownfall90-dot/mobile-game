name: Vita checks

on:
  push:
    branches: [main, claude/project-thread-x4ht8m]
  pull_request:
  workflow_dispatch:
    inputs:
      full_levels:
        description: Полная проверка уровней G1–G7
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vita-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Vita checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified Godot 4.5.1
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot.zip"
          echo "02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.5.1-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/Godot_v4.5.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/vita-profile" >> "$GITHUB_ENV"
      - name: Validate level data
        run: python3 tools/lint_levels.py
      - name: Import assets
        run: |
          if ! "$GODOT" --headless --path . --import > "$RUNNER_TEMP/import.log" 2>&1; then
            cat "$RUNNER_TEMP/import.log"
            exit 1
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/import.log"; then exit 1; fi
      - name: Check saves and repair progress
        run: |
          "$GODOT" --headless --path . -- --home-selfcheck 2>&1 | tee "$RUNNER_TEMP/home-check.log"
          grep -Fx 'HOME SELF-CHECK OK' "$RUNNER_TEMP/home-check.log"
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/home-check.log"; then exit 1; fi
      - name: Check screens and win-loss flow
        run: bash tools/smoke.sh
      - name: Play every level solution
        run: STRICT=1 bash tools/test_levels.sh
      - name: Full level verification (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.full_levels
        run: python3 tools/verify.py --godot "$GODOT" --no-cache
